<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkle - Video Effect & Template Creator Platform</title>
    <link rel="stylesheet" href="landing-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <h1 class="platform-name">Sparkle</h1>
                </div>
                <nav class="nav">
                    <a href="academy.html" class="nav-link">Academy</a>
                    <a href="income.html" class="nav-link">Income</a>
                    <a href="#" class="nav-link">Create</a>
                    <a href="#" class="nav-link">My effects</a>
                </nav>
            </div>
        </header>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-text">
                    <h1 class="platform-title">Sparkle</h1>
                    <p class="subtitle-2">Create and Earn</p>
                    <p class="subtitle">Video effect & template creator platform</p>
                    <button class="cta-button" onclick="window.location.href='dashboard.html'">Sign up for for the program</button>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Left Section: Popular Creator -->
                <div class="left-section">
                    <div class="popular-creator">
                        <h2 class="section-title">Popular creator</h2>
                        <div class="creator-card">
                            <div class="creator-avatar">
                                <img src="https://via.placeholder.com/120x120/d1d5db/ffffff?text=👤" alt="Creator Avatar" class="avatar-img">
                            </div>
                            <div class="creator-info">
                                <h3 class="creator-nickname">Creator name</h3>
                                <div class="creator-tags">
                                    <span class="tag">Dance</span>
                                    <span class="tag">Creative</span>
                                    <span class="tag">Animal</span>
                                </div>
                                <div class="creator-stats">
                                    <div class="stat-row">
                                        <div class="stat-item">
                                            <span class="stat-label">Total earning</span>
                                            <span class="stat-value">$4487.69</span>
                                        </div>
                                        <div class="stat-item">
                                            <span class="stat-label">Today</span>
                                            <span class="stat-value">$87.11</span>
                                        </div>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-label">Effect created</span>
                                        <span class="stat-value">17</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Section: Popular Effect -->
                <div class="right-section">
                    <div class="popular-effect">
                        <h2 class="section-title">Popular effect</h2>
                        <!-- Category Tabs -->
                        <div class="category-tabs">
                            <button class="category-tab active">Dance</button>
                            <button class="category-tab">Funny</button>
                            <button class="category-tab">Beauty</button>
                            <button class="category-tab">Creative</button>
                            <button class="category-tab">Action & Movement</button>
                            <button class="category-tab">Transform</button>
                        </div>

                        <!-- Video Grid -->
                        <div class="video-grid">
                            <div class="video-card">
                                <img src="https://via.placeholder.com/240x320/d1d5db/ffffff?text=Effect+1" alt="Effect 1">
                            </div>
                            <div class="video-card">
                                <img src="https://via.placeholder.com/240x320/d1d5db/ffffff?text=Effect+2" alt="Effect 2">
                            </div>
                            <div class="video-card">
                                <img src="https://via.placeholder.com/240x320/d1d5db/ffffff?text=Effect+3" alt="Effect 3">
                            </div>
                            <div class="video-card">
                                <img src="https://via.placeholder.com/240x320/d1d5db/ffffff?text=Effect+4" alt="Effect 4">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
